name: Site build

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/site-build.yml"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "scripts/**"
      - "site/**"
      - "reviews/**"
      - "methodology/**"
      - "docs/**"
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/site-build.yml"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "scripts/**"
      - "site/**"
      - "reviews/**"
      - "methodology/**"
      - "docs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run validate:content
      - run: npm run build
