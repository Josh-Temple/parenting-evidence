name: Site build

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/site-build.yml"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "scripts/**"
      - "site/**"
      - "reviews/**"
      - "methodology/**"
      - "docs/publication-gate.md"
      - "docs/site-mvp-spec.md"
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - ".github/workflows/site-build.yml"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "scripts/**"
      - "site/**"
      - "reviews/**"
      - "methodology/**"
      - "docs/publication-gate.md"
      - "docs/site-mvp-spec.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - run: npm ci
      - run: npm run validate:content
      - run: npm run build
